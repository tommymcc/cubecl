[package]
authors = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
categories = ["science"]
description = "AMD ROCm HIP runtime for CubeCL"
edition.workspace = true
keywords = ["gpu", "amd", "rocm", "hip"]
license.workspace = true
name = "cubecl-hip"
readme.workspace = true
repository = "https://github.com/tracel-ai/cubecl/tree/main/crates/cubecl-hip"
version.workspace = true


[lints]
workspace = true


[features]
default = [
    "std",
    "cubecl-server/default",
    "cubecl-common/default",
    "cubecl-core/default",
]

persistence = ["cubecl-server/persistence"]
std = [
    "cubecl-server/std",
    "cubecl-common/std",
    "cubecl-core/std",
    "cubecl-cpp/std",
]

cpp = []

pliron-dump = ["cubecl-cpp/pliron-dump", "cubecl-llvm/pliron-dump"]
rocwmma = []

tracing = [
    "dep:tracing",
    "cubecl-server/tracing",
    "cubecl-common/tracing",
    "cubecl-core/tracing",
]

[dependencies]
# tommymcc fork: the other cubecl crates come from crates.io at exactly this
# release rather than by path, so a git dependency on this crate alone builds
# against the same cubecl as everything else.
# Runtime Deps
log = { workspace = true }
tracing = { workspace = true, features = ["attributes"], optional = true }

cubecl-common = { version = "=0.12.0-pre.2", default-features = true, features = [
    "std",
    "hash",
] }
cubecl-environment = { version = "=0.12.0-pre.2", default-features = false }
cubecl-core = { version = "=0.12.0-pre.2", default-features = false, features = [
    "amd",
] }
cubecl-cpp = { version = "=0.12.0-pre.2", default-features = false, features = [
] }
cubecl-hip-sys = { version = "7.14.6085001" }
cubecl-llvm = { version = "=0.12.0-pre.2", default-features = false, features = [
    "std",
    "amdgpu",
] }
cubecl-monitoring = { version = "=0.12.0-pre.2", default-features = false, features = [
    "amdgpu-busy-percent",
    "gpu-engine-counters",
] }
cubecl-server = { version = "=0.12.0-pre.2", default-features = false }

bytemuck = { workspace = true }

derive-new = { workspace = true }
half = { workspace = true }
libloading = { workspace = true }
paste = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
cubecl-core = { version = "=0.12.0-pre.2", default-features = true, features = [
    "export_tests",
] }
cubecl-std = { version = "=0.12.0-pre.2", default-features = true, features = [
    "export_tests",
] }
test-log = { workspace = true, features = ["trace"] }
